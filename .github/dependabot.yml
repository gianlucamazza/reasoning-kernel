version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      pydantic:
        applies-to: security-updates
        patterns:
          - "pydantic"
          - "pydantic-core"
          - "pydantic-settings"
