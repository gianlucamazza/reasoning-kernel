name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_providers:
        description: Comma-separated providers required by the live gate
        required: true
        default: deepseek,openai
        type: string
  workflow_call:
    inputs:
      live_providers:
        description: Comma-separated providers required by the live gate
        required: false
        default: ""
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      DEEPSEEK_API_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          checksum: "173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b"
          python-version: "3.12"
          enable-cache: true

      - name: Check documentation
        run: uv run --no-project python scripts/check_docs.py

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          checksum: "173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b"
          python-version: "3.12"
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Audit locked dependencies
        run: just audit-deps

  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          checksum: "173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b"
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Sync dependencies
        run: uv sync --all-extras --locked

      # The justfile uses `set dotenv-load`; provide a no-secret env so it loads cleanly.
      # The default suite is key-free and `live` tests are excluded via addopts -m 'not live'.
      - name: Prepare env
        run: cp .env.example .env

      - name: Offline quality gate
        run: just check

  artifact-roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          checksum: "173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b"
          python-version: "3.12"
          enable-cache: true

      - name: Build distribution
        run: |
          uv sync --all-extras --locked
          uv build --clear
          uv run twine check --strict dist/*
          uv run python scripts/check_artifacts.py dist
          sha256sum dist/* > SHA256SUMS

      - name: Upload distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-distribution
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 1

      - name: Download distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ci-distribution
          path: roundtrip

      - name: Verify downloaded bytes
        working-directory: roundtrip
        run: sha256sum --check SHA256SUMS

  # Explicit provider qualification: manual or required by the release's reusable workflow call.
  live:
    if: inputs.live_providers != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.10"
          checksum: "173d95a0c32d18c896c46ba6fafbf3cf9c14ab74b033f81b76c883ef492a976b"
          python-version: "3.12"
          enable-cache: true

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Sync dependencies
        run: uv sync --all-extras --locked

      - name: Run live provider tests
        env:
          RK_LIVE_PROVIDERS: ${{ inputs.live_providers }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          just test-live --junitxml=live-tests.xml
          uv run python - <<'PYCODE'
          import json
          import os
          import platform
          from importlib.metadata import version
          from pathlib import Path
          from reasoning_kernel.reasoner.factory import default_model_for

          providers = sorted({
              name.strip()
              for name in os.environ["RK_LIVE_PROVIDERS"].split(",")
              if name.strip()
          })
          metadata = {
              "commit": os.environ["GITHUB_SHA"],
              "package_version": version("capability-reasoning-kernel"),
              "python_version": platform.python_version(),
              "requested_models": {name: default_model_for(name) for name in providers},
              "sdk_versions": {name: version(name) for name in ("openai", "anthropic")},
          }
          Path("live-metadata.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PYCODE

      # Default success condition: failed runs never upload captured provider errors.
      - name: Upload successful live qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: live-qualification
          path: |
            live-tests.xml
            live-metadata.json
          if-no-files-found: error
          retention-days: 90
